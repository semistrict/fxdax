\* Safety, one reader with mappings it loads through across a batch of two commits each
\* changing a file (TASK-42.10): every invariant holds, with all the protocol's rules in force.
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 2
    MaxOps = 6
    Limit = 2
    Rules <- AllRules
INVARIANTS
    TypeOK
    NoTornReads
    NoGoingBack
    NoReleasedReads
    OpenFilesReadable
    NoErrors
    MappingsLive
    GravesLive
    NoStaleMappings
    NoLeakedPins
CHECK_DEADLOCK FALSE
