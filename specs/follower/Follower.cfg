\* Safety, one reader, deep: every invariant holds, with all the protocol's rules in force.
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 3
    Limit = 2
    Rules <- AllRules
INVARIANTS
    TypeOK
    NoTornReads
    NoGoingBack
    NoReleasedReads
    OpenFilesReadable
    NoErrors
    MappingsLive
    GravesLive
    NoStaleMappings
    NoLeakedPins
CHECK_DEADLOCK FALSE
