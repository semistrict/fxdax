\* No cut-off: a follower that hangs keeps the writer's frees for ever.
\* expect: property LagCutOff
SPECIFICATION StalledSpec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 1
    Limit = 1
    Rules = {"barrier", "invalidate", "keepFrees", "graveyard"}
PROPERTY LagCutOff
CHECK_DEADLOCK FALSE
