    MaxOps = 2
    K = 1
    Limit = 2
    Rules = {"validate", "fallback", "invalidate", "graceFirst", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoReleasedReads
CHECK_DEADLOCK FALSE
