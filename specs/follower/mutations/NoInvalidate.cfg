\* A batch's changed files keep their DAX mappings: they map what the file held before.
\* expect: NoStaleMappings
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    Limit = 2
    Rules = {"barrier", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoStaleMappings
CHECK_DEADLOCK FALSE
