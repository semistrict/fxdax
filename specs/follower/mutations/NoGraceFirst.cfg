\* A read(2) enters the SRCU read section only after reading its extent: a grace period that
\* began in between doesn't wait for it.
\* expect: NoReleasedReads
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    K = 1
    Limit = 2
    Rules = {"validate", "fallback", "invalidate", "grace", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoReleasedReads
CHECK_DEADLOCK FALSE
