\* Readers take no fill barrier: a read(2) still copying from an extent a batch freed, as the
\* batch applies and its view advances, finds it released.
\* expect: NoReleasedReads
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    Limit = 2
    Rules = {"invalidate", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoReleasedReads
CHECK_DEADLOCK FALSE
