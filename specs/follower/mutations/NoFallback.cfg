\* No fallback to the mutex: a reader retries as long as batches keep coming.
\* expect: BoundedRetries
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    K = 1
    Limit = 2
    Rules = {"validate", "invalidate", "grace", "graceFirst", "keepFrees", "graveyard", "cutOff"}
INVARIANT BoundedRetries
CHECK_DEADLOCK FALSE
