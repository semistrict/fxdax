\* Readers take no fill barrier: a reader faults a file a batch changed, as of its commit, then
\* loads another it changed through its mapping, which the batch hasn't dropped yet, as of a
\* commit before.
\* expect: NoGoingBack
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 2
    MaxOps = 6
    Limit = 2
    Rules = {"invalidate", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoGoingBack
CHECK_DEADLOCK FALSE
