\* Readers take no fill barrier: a pair read sees a rename half applied.
\* expect: NoTornReads
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    Limit = 2
    Rules = {"invalidate", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoTornReads
CHECK_DEADLOCK FALSE
