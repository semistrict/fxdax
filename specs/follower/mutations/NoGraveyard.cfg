\* No graveyard: a file the writer deletes while a reader has it open can't be read to its end.
\* expect: OpenFilesReadable
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    Limit = 2
    Rules = {"barrier", "invalidate", "keepFrees", "cutOff"}
INVARIANT OpenFilesReadable
CHECK_DEADLOCK FALSE
