\* Reads not checked against the seqcount: a pair read can see a rename half applied.
\* expect: NoTornReads
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 3
    MaxOps = 2
    K = 1
    Limit = 2
    Rules = {"fallback", "invalidate", "grace", "graceFirst", "keepFrees", "graveyard", "cutOff"}
INVARIANT NoTornReads
CHECK_DEADLOCK FALSE
