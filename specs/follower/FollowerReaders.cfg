\* Safety, two readers: every invariant holds, with all the protocol's rules in force, as readers
\* share a file's graveyard copy, a grace period waits for both, and one falls back while the
\* other reads.
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {r1, r2}
    MaxCommits = 2
    MaxOps = 2
    K = 1
    Limit = 2
    Rules <- AllRules
SYMMETRY ReaderSymmetry
INVARIANTS
    TypeOK
    NoTornReads
    NoReleasedReads
    OpenFilesReadable
    NoErrors
    MappingsLive
    GravesLive
    NoStaleMappings
    BoundedRetries
    NoLeakedPins
CHECK_DEADLOCK FALSE
