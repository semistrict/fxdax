\* Safety, two readers: every invariant holds, with all the protocol's rules in force, as
\* readers share a file's graveyard copy, and a batch waits for both to be done.
SPECIFICATION Spec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {r1, r2}
    MaxCommits = 2
    MaxOps = 2
    Limit = 2
    Rules <- AllRules
SYMMETRY ReaderSymmetry
INVARIANTS
    TypeOK
    NoTornReads
    NoGoingBack
    NoReleasedReads
    OpenFilesReadable
    NoErrors
    MappingsLive
    GravesLive
    NoStaleMappings
    NoLeakedPins
CHECK_DEADLOCK FALSE
