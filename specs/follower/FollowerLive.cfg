\* Liveness, under fairness: the writer never waits, the follower catches up, readers finish,
\* and a lagging follower is cut off. Smaller bounds: TLC checks liveness on the whole graph.
SPECIFICATION LiveSpec
CONSTANTS
    Files = {"f1", "f2"}
    Readers = {"r1"}
    MaxCommits = 2
    MaxOps = 2
    Limit = 1
    Rules <- AllRules
INVARIANTS
    TypeOK
    NoErrors
PROPERTIES
    WriterNeverWaits
    FollowerCatchesUp
    FreesGo
    ReadersFinish
    LagCutOff
CHECK_DEADLOCK FALSE
