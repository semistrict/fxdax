\* A traced run of crates/follower's Shuttle tests, which FollowerTraceData holds: the trace
\* matched to its end violates TraceMatched; a step the spec doesn't allow leaves it unviolated.
SPECIFICATION TraceSpec
CONSTANTS
    Files = {"f1", "f2"}
    Readers <- TraceReaders
    MaxCommits <- TraceMaxCommits
    MaxOps = 100
    Limit = 100
    Rules <- AllRules
    InitExtent <- TraceInitExtent
INVARIANTS
    TraceMatched
    NoErrors
CHECK_DEADLOCK FALSE
