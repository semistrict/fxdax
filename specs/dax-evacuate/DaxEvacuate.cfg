\* A page's writes, seals, evacuations, prunes and truncation, with every rule in force: the guest
\* reads what was written last, Fxfs holds it, and nothing deadlocks.
SPECIFICATION Spec
CONSTANTS
    Rules <- AllRules
    Staging = {1, 2}
    MaxWrites = 2
INVARIANTS TypeOK ViewConsistent Durable
CHECK_DEADLOCK TRUE
