\* Two deletions of the root at once, its writer's segments of forks, one sealing an extent on
\* its own too, in flight, and the collector: 2 hosts, 3 branches, 3 segments, 1 collector
\* (TASK-380). Only the root is deleted: deleting the children too, the model outgrew hours.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "fork", "forkOwn", "deleteRoot", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- Pair
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
