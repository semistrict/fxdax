\* Acknowledging a segment going on with a commit, not ending it: the writer's checkpoint as of it
\* holds the commit begun, whose run no state names; the collector, going by the checkpoint,
\* deletes the segment it is in; the segment ending the commit lands, and the branch names an
\* extent in a segment gone.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "span", "checkpoint", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack", "retirementsMarked"}
    CellOf <- OneCell
INVARIANT NothingNeededGone
CHECK_DEADLOCK FALSE
