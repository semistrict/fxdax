\* References written late: the parent's deletion marks its record deleted, then writes its
\* fork's reference; between, its cell's pass sees nothing live and deletes the fork's segment.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "delete", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack", "retirementsMarked"}
    CellOf <- CellEach
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
