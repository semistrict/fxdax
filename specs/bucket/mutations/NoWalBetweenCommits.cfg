\* The WAL put after the branch mid-commit: a host crashes with a commit spanning segments in its
\* WAL, none uploaded; its next writer takes the segment going on with the commit as landed, the
\* guest's last commit as of it being the branch's, and restamps only the one ending it: the
\* branch has the commit without the extent sealed in the other.
\* expect: HistoriesOwn
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 1
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"mint", "span", "crash"}
    None = None
    Rules = {"fencesKept", "straysKept", "takeoversKept", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "wholeCommitsKept", "walContinues"}
INVARIANT HistoriesOwn
CHECK_DEADLOCK FALSE
