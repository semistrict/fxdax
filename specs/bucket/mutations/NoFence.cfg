\* No fence: a writer taking over recovers an extent of its own of the writer before, whose segment
\* freeing it lands after; the collector deletes it, which the writer whose lease it is still reads.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "mint", "own", "free", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept"}
    CellOf <- OneCell
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
