\* A fork point kept by the extents its state names alone, not what recovering it reads: the
\* parent deleted, its cell's pass deletes the fork's segment, which holds no extent, and the
\* child, of no checkpoint, recovers through it.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "delete", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "clonesRecordFirst", "referencesTakenBack", "retirementsMarked"}
    CellOf <- CellEach
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
