\* The collector recovering each branch once (TASK-173, the code as it was): a pass, having read
\* the records, recovers the root by its checkpoint, a fork to a child in it with no record, refused
\* as a restore of a point took the child's ID, and the child by the root's state there; listing the
\* records again, it finds the child's record, of the point's origin, and recovers it no more, so it
\* deletes the root's segments to the point, which its checkpoint covers and the child needs.
\* Without references too: since TASK-395.1 the restore's reference keeps its origin's state at
\* the fork point, as recovering the child by that origin did (TLC finds no violation with them).
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "point", "restore", "deletePoints", "checkpoint", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept"}
    CellOf <- OneCell
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
