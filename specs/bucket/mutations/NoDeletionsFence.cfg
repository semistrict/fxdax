\* A deletion's recovery fencing nothing (TASK-183, the code as it is): a writer's fork segment is
\* in flight, never acknowledged; two deletions of the branch read its record live; the first
\* recovers it to the gap and marks it deleted, and a pass, reading it deleted and no record of the
\* fork's child, goes on to delete its segments; the fork's segment lands, and the second deletion
\* recovers past it and records the child, whose origin the pass deletes.
\* expect: NothingNeededGone
