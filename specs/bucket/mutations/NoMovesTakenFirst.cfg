\* A writer naming what its checkpoint moved where it went only once the checkpoint's create is
\* answered: the collector, trusting the checkpoint of the writer holding the lease, compacts the
\* moves it names and deletes the segment, then the moves, before the writer names the extent past
\* them; it finds neither.
