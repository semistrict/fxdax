\* Acknowledging without reading the lease after the creates: a writer taken over has its segment
\* land where the next writer's fence was, which that writer's checkpoint covered and the collector
\* deleted; it acknowledges a commit no history holds.
\* expect: NoAckedLost
SPECIFICATION Spec
