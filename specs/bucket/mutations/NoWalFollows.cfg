\* A WAL put after the branch though another writer moved it on: a host crashing with its WAL takes
\* the branch back after another host's commit, acknowledged, and puts its own after it.
\* expect: NoAckedLost
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 5
    MaxTakes = 3
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"commit", "crash"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack"}
    CellOf <- OneCell
INVARIANT NoAckedLost
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
