\* A reference retired, or taken back, deleted unmarked: a writer of a fork's child's record whose
\* read found none writes the fork's reference after the child's ID, taken by a root meanwhile, had
\* it taken back by the parent's deletion; the reference stands, no record naming it, nor a mark
\* for its parent's cell's pass to delete it by (TASK-395.13). Its kin, a reference written again
\* after its child's cell's pass retired it, which that cell's passes, skipping it, never retire
\* again (TASK-395.14), takes more steps.
\* expect: ReferencesRetiredMarked
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 2
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "contest", "delete"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesFirst", "referencesTakenBack"}
    CellOf <- CellEach
INVARIANT ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
