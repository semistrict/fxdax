\* The collector dropping a deleted root's record (TASK-174, the code as it was): a root takes the
\* ID of a fork's child and is deleted; the fork's parent's writer acknowledges the fork but is slow
\* to record its child; the parent's deletion finds the child's record deleted and records none; a
\* pass drops that record and the parent's segments; the slow writer then makes the child's record,
\* which names what the pass deleted.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "unfork", "contest", "delete", "collect", "staleTake"}
    None = None
    Rules = {"fencesKept", "takeoversKept", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
