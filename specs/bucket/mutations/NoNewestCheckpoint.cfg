\* A recovery finding a segment missing, not looking for a newer checkpoint: the collector deleted
\* it, a checkpoint having come that covers it, and the writer taking over fences there, its guest
\* missing a commit acknowledged. Without pinsTakings too (TASK-371, TASK-388): the collector keeping a
\* branch's segments while a writer takes it over, which it does from the writer's taking, before
\* the writer's recovery lists the checkpoints, covers this case of the rule alone; its other, of
\* what a fork inherited, NoNewestCheckpointInherited shows.
\* expect: NoAckedLost
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "checkpoint", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack"}
    CellOf <- OneCell
INVARIANT NoAckedLost
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
