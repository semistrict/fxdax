\* A fork of a point not reading the point after its child's record: from a stale copy of a point
\* deleted, whose branch is deleted too, a pass that never saw the child deletes what it needs.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "delete", "collect"}
    None = None
    Rules = {"pinsFences", "pinsOldFences", "pinsVoidStrays", "pinsLateStrays", "pinsTakings", "forksAfterLease", "fence", "continuity", "epochSequences", "recordsAfterAck", "candidatesFirst", "newestCheckpoint", "forksFromStates", "orphansAfterSuccessor", "tokens", "deleteTokens", "footers", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "extentKeysNameSegments", "waysFromSeals", "movesTakenFirst", "leasesByTakings", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "deletionsFence", "deletionsReread", "walFollows", "walAfterFence", "spansHeld", "spansFenced", "acksBetweenCommits", "walBetweenCommits", "wholeCommitsKept", "walContinues", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack"}
    CellOf <- OneCell
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
