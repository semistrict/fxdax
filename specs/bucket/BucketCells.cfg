\* Forks across cells (TASK-395.1): a cell each, the root forking a child that forks a
\* grandchild (each the least free ID), any of them deleted, three passes of the collector, of any
\* cells, one after another: references written, kept by, and retired from the parents' cells,
\* down the whole chain. 1 host, 3 branches in 3 cells, 2 segments (a fence, a fork), 3 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 2
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "delete", "collect", "forkNext"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
