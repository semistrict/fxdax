\* Forks of two branches naming one child: 1 host, 3 branches, 4 segments.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "contest"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
