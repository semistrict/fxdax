\* Clones of points whose hosts die (TASK-395.10): a point of the root restored into a third cell,
\* the host crashing at any step, the point and the root deleted, two passes of any cells: every
\* reference named by its child's record, which retires it, or still being made. 1 host, 3
\* branches in 3 cells, 2 segments, 2 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 2
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"point", "restore", "crash", "deletePoints", "deleteRoot", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
