\* Placements and their fencing tokens: takeovers, crashes, stale placements taking branches back
\* and deleting them: 2 hosts, 2 branches, 4 segments.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 3
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 2
    MaxCrashes = 1
    Can = {"commit", "place", "delete", "crash", "disk"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
