\* Extents sealed into segments, freed, compacted into moves, those into theirs, and deleted over
\* two passes, under takeovers, stale creates and late checkpoints: 2 hosts, 2 branches, 3
\* segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 2
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "free", "checkpoint", "collect", "compact", "compactMoves"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
