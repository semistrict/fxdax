\* Commits spanning segments (TASK-92.41): extents sealed where they were written, in segments
\* going on with the commit, the first perhaps ending the commit before (spanOn, TASK-345); hosts
\* crashing, keeping their WALs to their last durable commits or losing them; the branch taken over
\* and back: 2 hosts, 2 branches, 6 segments.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 6
    MaxTakes = 3
    MaxCommits = 2
    MaxMints = 2
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"commit", "mint", "span", "spanOn", "crash", "disk", "cut"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
