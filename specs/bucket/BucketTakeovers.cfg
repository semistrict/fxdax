\* The hunt for a fourth way to lose an acknowledged commit to the collector (TASK-388): four
\* writers taking a branch over one another, on three hosts, their segments in flight past their
\* successors' fences, late fences among them, with checkpoints and a pass: one takeover and one
\* writer more than any model before. 3 hosts, 1 branch, 5 segments, 2 commits, 1 collector. Each
\* writer's creates land in the order it made them ("landInOrder"): in any order, and with 6
\* segments and 3 commits, TLC found 60 million states, 27 million left, in half an hour. So it
\* holds no void stray, which needs a writer's two segments in flight and a third commit:
\* BucketStrays has those. 207 million states, 1 h 47 min on a laptop's 14 cores (2026-11-12).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    Branches = {1}
    Root = 1
    Segs = 5
    MaxTakes = 4
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "checkpoint", "collect", "landInOrder"}
    None = None
    Rules <- AllRules
    CellOf <- OneCell
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
