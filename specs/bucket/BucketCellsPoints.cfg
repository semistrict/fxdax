\* Points and their clones across cells (TASK-395.1): a cell each, a point of the root restored
\* from stale copies, the point and the root deleted (a clone only as its restore fails), two
\* passes of the collector of any cells, overlapping: a clone's reference under the root's cell,
\* written before its record and its read of the point's, kept by and retired from that cell.
\* 1 host, 3 branches in 3 cells, 3 segments, 2 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "deletePoints", "deleteRoot", "collect", "overlap"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
