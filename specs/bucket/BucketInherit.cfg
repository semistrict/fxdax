\* What forks inherit, freed by their parents, and deletions, with the collector: 1 host, 2
\* branches, 4 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 3
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "own", "free", "fork", "delete", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
