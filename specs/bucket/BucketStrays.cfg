\* Three writers taking a branch over one another, each one's segments in flight as the next
\* takes it, landing late, strays before the next's fence (void, or a late fence following
\* another's), with checkpoints and a pass of the collector: 2 hosts, 1 branch, 4 segments, 1
\* collector (TASK-383).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1}
    Root = 1
    Segs = 4
    MaxTakes = 3
    MaxCommits = 3
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
