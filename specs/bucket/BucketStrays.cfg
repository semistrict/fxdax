\* Three writers taking a branch over one another, each one's segments in flight as the next
\* takes it, landing late, strays before the next's fence (void, or a late fence following
\* another's), a writer on an earlier one's host putting its WAL after its fence, with
\* checkpoints and a pass of the collector: 2 hosts, 1 branch, 6 segments, 1 collector (TASK-383,
\* TASK-388; with 4, no writer had room for a WAL, and the void stray went unmodelled).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1}
    Root = 1
    Segs = 6
    MaxTakes = 3
    MaxCommits = 3
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- OneCell
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
