\* Writers taking a branch over one another, crashing with their WALs or without, checkpoints
\* and a pass of the collector: 2 hosts, 2 branches, 4 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"commit", "crash", "disk", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
