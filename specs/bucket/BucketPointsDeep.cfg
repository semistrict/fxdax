\* As BucketPoints, a commit more, points the only branches deleted: restores and forks naming
\* one child, checkpoints dropping deleted points: 1 host, 3 branches, 3 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "point", "restore", "deletePoints", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
