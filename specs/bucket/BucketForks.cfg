\* Forks, failed forks' deletions, branch IDs taken by others, deletions, two at once, takings from
\* records read before deletions, and the collector: 2 hosts, 2 branches, 4 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "unfork", "contest", "delete", "collect", "staleTake"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
