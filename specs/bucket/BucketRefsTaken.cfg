\* References of forks whose children's IDs other branches take (TASK-395.10): a fork to another
\* cell, its child's ID taken by a root as its writer records it, the writer's host crashing, the
\* parent deleted, and a pass of any cell: every reference named by its child's record, or still
\* to be named or taken back. 1 host, 2 branches in 2 cells, 3 segments, 1 pass.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"fork", "contest", "delete", "crash", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
