\* Commits spanning segments under the collector: extents sealed where they were written, in
\* segments going on with their commits, checkpointed and compacted, a takeover: 2 hosts, 2
\* branches, 4 segments, a pass.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 2
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "span", "checkpoint", "collect", "compact", "compactMoves"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
