\* Points forked, restored and deleted, from stale copies, the branches they name deleted, with
\* checkpoints and two passes of the collector: 1 host, 3 branches, 3 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "delete", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
