\* Passes of the collector overlapping, a later one taking the lease from an earlier, under points
\* deleted and restored from stale copies, their parent deleted: 1 host, 3 branches, 3 segments, 2
\* passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "delete", "collect", "overlap"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
