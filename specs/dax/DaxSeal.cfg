\* The seal and relocation protocol with all its rules in force: no SIGBUS, no store into a sealed
\* extent, entries and mappings coherent, data kept, and no deadlock.
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules <- AllRules
INVARIANTS
    NoSigbus
    NoSealedStores
    Coherent
    DataKept
CHECK_DEADLOCK TRUE
