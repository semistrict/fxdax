\* dce4f14's bug: a write(2)'s iomap forgets the relocation mark, and replaces the page's entry
\* only once past its iomap; a fault in between keeps the entry of where the page was.
\* expect: NoSigbus
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"shared", "wp", "forgetWritable", "sealsCheck", "gateWait", "tryGate"}
INVARIANT NoSigbus
CHECK_DEADLOCK FALSE
