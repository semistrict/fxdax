\* A write maps its moved page writably though a seal came between the move and the gate, and
\* sealed the block it moved to.
\* expect: NoSealedStores
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"faultsOnly", "shared", "wp", "forgetWritable", "gateWait", "tryGate"}
INVARIANT NoSealedStores
CHECK_DEADLOCK FALSE
