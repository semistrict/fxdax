\* The sealer leaves the window's pages writable: a write(2) takes the page where it is, sealed.
\* expect: NoSealedStores
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"faultsOnly", "shared", "wp", "sealsCheck", "gateWait", "tryGate"}
INVARIANT NoSealedStores
CHECK_DEADLOCK FALSE
