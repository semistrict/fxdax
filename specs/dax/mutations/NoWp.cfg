\* The sealer leaves user mappings writable: a store through one lands in the extent it sealed.
\* expect: NoSealedStores
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"faultsOnly", "shared", "forgetWritable", "sealsCheck", "gateWait", "tryGate"}
INVARIANT NoSealedStores
CHECK_DEADLOCK FALSE
