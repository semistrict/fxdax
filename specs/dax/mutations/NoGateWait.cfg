\* A seal doesn't wait for the stores in the gate: a write(2) copying finds its block sealed.
\* expect: NoSealedStores
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"faultsOnly", "shared", "wp", "forgetWritable", "sealsCheck", "tryGate"}
INVARIANT NoSealedStores
CHECK_DEADLOCK FALSE
