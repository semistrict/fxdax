\* A fault waits for the gate holding its page's DAX entry: a write(2) in the gate waits for the
\* entry, the seal for the write, the fault for the seal.
\* expect: deadlock
SPECIFICATION Spec
CONSTANTS
    MaxWrites = 2
    MaxFaults = 3
    MaxStores = 2
    MaxSeals = 2
    Rules = {"faultsOnly", "shared", "wp", "forgetWritable", "sealsCheck", "gateWait"}
CHECK_DEADLOCK TRUE
