\* Copy-on-write DAX with its rules in force: no store lost, fsyncs keep theirs, clean pages in
\* Fxfs as the window shows them, no MAP of an open extent, crashes old or new, the guest within
\* private_max, and no deadlock.
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusedStore
    PrivateWithinMax
CHECK_DEADLOCK TRUE
