\* Copy-on-write DAX with its rules in force: no store lost, fsyncs keep theirs, clean pages in
\* Fxfs as the window shows them, no MAP of an open extent, crashes old or new, the guest within
\* private_max, dirty pages private, and no deadlock; no loads (DaxCowLoads has them).
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    MaxLoads = 0
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusal
    DirtyImpliesPrivate
    PrivateWithinMax
    NoStaleLoad
CHECK_DEADLOCK TRUE
