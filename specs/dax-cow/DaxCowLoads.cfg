\* As DaxCow, with the guest's loads (TASK-276.6): each a first touch of a page the window names,
\* which the VM process installs, racing a store's PRIVATE, a punch's MAP of zeros, a rebind's MAP,
\* a seal's free and the host's eviction of the page: no load reads what the window mapped before,
\* and the rest holds as in DaxCow. A store and a punch, which keep it small enough to search.
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 1
    MaxPunches = 1
    MaxLoads = 2
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusal
    DirtyImpliesPrivate
    PrivateWithinMax
    NoStaleLoad
CHECK_DEADLOCK TRUE
