\* Writeback commits before its bytes are written: a seal between makes durable a block nothing
\* wrote, which a crash shows.
\* expect: CrashOldOrNew
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "countPrivate"}
INVARIANT CrashOldOrNew
CHECK_DEADLOCK FALSE
