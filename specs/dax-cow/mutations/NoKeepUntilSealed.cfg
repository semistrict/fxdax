    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "countPrivate", "bytesFirst"}
INVARIANT NoOpenMap
CHECK_DEADLOCK FALSE
