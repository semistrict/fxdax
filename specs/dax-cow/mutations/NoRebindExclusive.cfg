\* A rebind under the semaphore shared: a write(2) dirties the page between the rebind's look at
\* the sets and its MAP, and stores, which the MAP of the extent's page discards.
\* expect: NoLostStore
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"swapFirst", "swapExclusive", "rebindAfterSeal", "keepUntilSealed", "countPrivate", "bytesFirst"}
INVARIANT NoLostStore
CHECK_DEADLOCK FALSE
