\* Writeback write-protects, then swaps the dirty set out: a fault between the two makes its PTE
\* writable and puts its page in the set the swap takes, and the store after the writeback's copy
\* is in no set: the next fsync writes nothing of it.
\* expect: FsyncKeepsStores
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "countPrivate", "bytesFirst"}
INVARIANT FsyncKeepsStores
CHECK_DEADLOCK FALSE
