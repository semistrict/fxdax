\* A rebind before the seal: it takes a page whose writeback committed and waits for its seal,
\* and MAPs the extent it is in, open: the host refuses it.
\* expect: NoOpenMap
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"privateAtIomap", "protectByPageTables", "swapFirst", "swapExclusive", "rebindExclusive", "keepUntilSealed", "countPrivate", "bytesFirst"}
INVARIANT NoOpenMap
CHECK_DEADLOCK FALSE
