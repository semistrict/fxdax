\* Writeback write-protects by the DAX entries (dax_writeback_mapping_range), which pass by one a
\* fault holds past its iomap_end: its PTE stays writable, and its store after the writeback's
\* copy is in no set, the page clean with Fxfs holding what it held before (guest/sim's seed 22).
\* expect: CleanInFxfs
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"privateAtIomap", "swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "countPrivate", "bytesFirst"}
INVARIANT CleanInFxfs
CHECK_DEADLOCK FALSE
