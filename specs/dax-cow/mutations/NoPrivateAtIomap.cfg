\* The iomap that dirties a page leaves it to the store to make private, the host copying at it,
\* as before TASK-164.9: a fault's store comes after its iomap_end and after the writeback that
\* write-protected its PTE; it faults again and finds its page dirty; meanwhile the writeback
\* copied the page, moved its block, and the seal after freed the old one, whose zeros the host
\* then copies, the rest of the page lost (guest/sim's seed 2802).
\* expect: NoLostStore
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"protectByPageTables", "swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "countPrivate", "bytesFirst"}
INVARIANT NoLostStore
CHECK_DEADLOCK FALSE
