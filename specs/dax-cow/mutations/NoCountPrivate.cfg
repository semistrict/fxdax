\* iomap_begin doesn't count its page private: the budget lets a second page be stored to past
\* private_max, and the host refuses the store, which stops the VM.
\* expect: NoRefusedStore
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "bytesFirst"}
INVARIANT NoRefusedStore
CHECK_DEADLOCK FALSE
