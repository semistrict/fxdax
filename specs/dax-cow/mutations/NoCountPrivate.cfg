\* iomap_begin doesn't count its page private: the budget lets a second page be made private past
\* private_max, and the host refuses its PRIVATE, which stops the VM.
\* expect: NoRefusal
SPECIFICATION Spec
CONSTANTS
    Pages = {1, 2}
    PrivateMax = 1
    MaxStores = 2
    MaxPunches = 1
    Rules = {"privateAtIomap", "protectByPageTables", "swapFirst", "swapExclusive", "rebindExclusive", "rebindAfterSeal", "keepUntilSealed", "bytesFirst"}
INVARIANT NoRefusal
CHECK_DEADLOCK FALSE
