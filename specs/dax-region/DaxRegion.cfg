\* A region's opening and its MAPs with their rules in force: no store the host refuses, no writable
\* MAP outside the gate, no MAP in flight as it opens, and no deadlock.
SPECIFICATION Spec
CONSTANT Rules <- AllRules
INVARIANT NoRefusedStores
INVARIANT NoWritableMapOutsideTheGate
INVARIANT NoMapInFlightUnderAnOpen
CHECK_DEADLOCK TRUE
