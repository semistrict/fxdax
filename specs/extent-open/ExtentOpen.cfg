\* An extent's writes, MAPs, commits and a fork with their rules in force: no write lost, no commit
\* refused, one owner, and no deadlock.
SPECIFICATION Spec
CONSTANTS
    Rules <- AllRules
    Writes = {"a", "b"}
    Commits = 2
INVARIANT TypeOK
INVARIANT NoLostWrite
INVARIANT NoRefusedCommit
INVARIANT OneOwner
CHECK_DEADLOCK TRUE
