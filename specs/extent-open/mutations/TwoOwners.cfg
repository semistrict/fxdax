\* TASK-150.7's bug, as TASK-153.3 has it: a MAP leaves the store holding open what it took into
\* memory, which a fork's commit seals, and the next commit's write of the memory is refused.
\* expect: NoRefusedCommit
SPECIFICATION Spec
CONSTANTS
    Rules = {"writeUnderLock"}
    Writes = {"a", "b"}
    Commits = 2
INVARIANT NoRefusedCommit
CHECK_DEADLOCK FALSE
