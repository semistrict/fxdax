[workspace]
resolver = "3"
members = ["crates/*"]
# The guest kernel's Rust is a workspace of its own (guest/rust), though fuchsia-async depends on
# its runtime for the kernel's target.
exclude = ["guest"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"

# The Fuchsia revision the crates copied or ported from Fuchsia follow (see
# scripts/upstream-changes.py). Third-party versions follow its third_party/rust_crates/Cargo.toml.
[workspace.metadata.fuchsia]
commit = "90e54e090540aaac37a81494884f4b8a68bc269c"

[workspace.lints.rust]
# Configuration flags Fuchsia's build sets; unset here.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(detect_lock_cycles)',
    'cfg(fuchsia_api_level_at_least, values(any()))',
    'cfg(fuchsia_api_level_less_than, values(any()))',
    'cfg(fuzz)',
    'cfg(fuzzing)',
    'cfg(vdso_next)',
] }

[workspace.dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
libc = { version = "0.2.189", features = ["extra_traits"] }
