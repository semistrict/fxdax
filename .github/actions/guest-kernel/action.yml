# fxdax's x86-64 guest kernel, a release build (scripts/build-guest-kernel.sh), kept between runs
# by what it's built from (scripts/guest-kernel-key.sh), on a runner the guest-host action set up.
# Kept as soon as it's built, not as the job ends well: a run that fails, as one may on its checks,
# would build it again, a quarter of an hour. Its 40 MB alone, not the cargo builds' 3-4 GB, a
# dozen minutes to build: the repository's caches are at GitHub's 10 GB already, and one more of
# them would have the others' evicted.
name: Guest kernel
description: The guest kernel, from the cache or built
outputs:
  vmlinux:
    description: The kernel's path
    value: ${{ steps.path.outputs.vmlinux }}

runs:
  using: composite
  steps:
    - name: The guest kernel's key
      id: kernel
      shell: bash
      run: echo "key=$(scripts/guest-kernel-key.sh)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v6
      id: kernel-cache
      with:
        path: ~/guest-kernel/vmlinux
        key: guest-kernel-${{ steps.kernel.outputs.key }}
    - name: Build the guest kernel
      if: steps.kernel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        FXDAX_GUEST_KERNEL_WORK=~/guest-kernel-work scripts/build-guest-kernel.sh x86_64
        mkdir -p ~/guest-kernel
        cp ~/guest-kernel-work/out/x86_64/vmlinux ~/guest-kernel/
    - uses: actions/cache/save@v6
      if: steps.kernel-cache.outputs.cache-hit != 'true'
      with:
        path: ~/guest-kernel/vmlinux
        key: guest-kernel-${{ steps.kernel.outputs.key }}
    - id: path
      shell: bash
      run: echo "vmlinux=$HOME/guest-kernel/vmlinux" >> "$GITHUB_OUTPUT"
