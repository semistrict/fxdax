# Ubuntu's packages a job installs, past an outage of ubuntu.com's names (TASK-360). GitHub's
# ubuntu-24.04 image fetches its archive through apt's mirror method
# (/etc/apt/sources.list.d/ubuntu.sources: URIs: mirror+file:/etc/apt/apt-mirrors.txt), from Azure's
# mirror, then archive.ubuntu.com, then security.ubuntu.com, each tried once more on failure
# (/etc/apt/apt.conf.d/zz-retries: Acquire::Retries 1): mirrors all named under ubuntu.com. On
# 2026-11-11 the runners' resolver (Azure's, 168.63.129.16) answered none of those names for hours,
# but kernel.org's and Microsoft's at once, and every Linux job failed here (main runs 43034685461
# to 43047616995). Retries can't outlast that; mirrors under other names can: kernel.org's and
# MIT's, listed after the image's own. apt checks what any mirror serves against the Ubuntu
# archive's key (Signed-By), as it checks Azure's. A mirror whose name doesn't resolve is dropped
# from the list first: apt's mirror method tries the list in order for every file, its lookups
# timing out after 20 s each, a minute or more a file before it reached kernel.org's, and an
# install of a few dozen packages took most of an hour.
# An index no mirror serves fails the update itself (APT::Update::Error-Mode=any), not an install
# from indices stale or absent after it. What it runs: apt-install.sh, beside it.
name: apt install
description: Install Ubuntu's packages, from mirrors outside ubuntu.com when its names don't resolve

inputs:
  packages:
    description: The packages, separated by spaces
    required: true

runs:
  using: composite
  steps:
    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # shellcheck disable=SC2086 # the packages, one word each
        "$GITHUB_ACTION_PATH/apt-install.sh" $PACKAGES
