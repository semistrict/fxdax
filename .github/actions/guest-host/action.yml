# A GitHub runner made a host of fxdax's guests, as the workflows that boot them use it
# (sandboxes.yml, nightly.yml's guest suites, TASK-284): GitHub's runners have KVM, nested, which
# their user is given here, with /dev/userfaultfd; what builds the guest kernel, Firecracker and
# its seccomp filters, and makes the guests' root images (scripts/lib/linux-host-setup.sh's, as a
# host's); and Rust, with musl's target, which Firecracker is built for under its filter.
name: Guest host
description: Let the runner boot fxdax's guests, and build what they boot

runs:
  using: composite
  steps:
    - name: Let the runner's user have KVM and userfaultfd
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
        KERNEL=="userfaultfd", GROUP="kvm", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-fxdax-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm trigger --name-match=userfaultfd
        ls -l /dev/kvm /dev/userfaultfd
    - name: Install the build's tools
      uses: ./.github/actions/apt-install
      with:
        packages: >-
          clang libclang-dev llvm pkg-config musl-tools e2fsprogs podman libseccomp-dev
          busybox-static flex bison bc cpio libelf-dev libssl-dev
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
