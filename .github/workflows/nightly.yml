# The guest suites, as production runs them: on a disposable GCE host with nested KVM
# (scripts/test-gce.sh), Firecracker in its jailer under its seccomp filter, and branches kept in
# real object storage. The nightly suite (`runner list --tag nightly`): the default suite's cases
# and the guest kernel's, which it lacked (followers, snapshots, volumes, pjdfstest), the
# others cheap on a release kernel (TASK-160.29), and xfstests' generic/quick with DAX and without,
# its known failures checked (TASK-149.20.1). Needs the repository's GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT
# secrets, and its FXDAX_GCE_PROJECT and FXDAX_NIGHTLY_BUCKET (gs://bucket/prefix) variables. And
# guest/sim whole, which CI runs whole only when what it tests changed (scripts/guest-sim-scope.py):
# 3,000 seeds of each of its seeded tests, and its sweep, every call of every run of one failing.
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  guest-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    permissions:
      contents: read
      id-token: write
    env:
      FXDAX_GCE_PROJECT: ${{ vars.FXDAX_GCE_PROJECT }}
      FXDAX_GCE_ZONE: us-west1-b
      FXDAX_GCE_STORAGE: '1'
      FXDAX_EXTENTD_REMOTE: ${{ vars.FXDAX_NIGHTLY_BUCKET }}
      FXDAX_RESULTS_BUCKET: ${{ vars.FXDAX_NIGHTLY_BUCKET }}/results
      FXDAX_FIRECRACKER_JAIL: '1'
      FXDAX_FIRECRACKER_SECCOMP: real
      FXDAX_WORKSPACE_TESTS: '0'
      FXDAX_E2E_TEST: --tag nightly
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Firecracker
        run: git submodule update --init
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Run the guest suites
        run: scripts/test-gce.sh all "fxdax-test-nightly-$GITHUB_RUN_ID" results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results
          path: results

  # guest/sim's 3,000 seeds, as CI runs them when what they test changed (TASK-149.14).
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: The mutants apply
        run: guest/sim/mutants.sh --check
      - name: Run 3,000 seeds of each
        run: guest/sim/zloop.sh -s 3000 -d "$BUILD/logs"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs

  # guest/sim's whole sweep, as CI runs it when what it tests changed (TASK-149.15).
  guest-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: Fail each call of every run of one in turn
        run: guest/sim/sweep.sh -d "$BUILD/sweep"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-sweep-logs
          path: target/sim/sweep
