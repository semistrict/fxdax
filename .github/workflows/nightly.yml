# The guest suites, as production runs them, on GitHub's runners, which have KVM (TASK-284):
# Firecracker in its jailer under its seccomp filter, and branches kept in object storage, an S3
# bucket on the runner (RustFS, scripts/test-e2e-rustfs.sh). The nightly suite (`runner list --tag
# nightly`): the default suite's cases and the guest kernel's, which it lacked (followers,
# snapshots, volumes, pjdfstest), the others cheap on a release kernel (TASK-160.29), and xfstests'
# generic/quick with DAX and without, its known failures checked (TASK-149.20.1). Built once, its
# artifacts and kernel shared by a matrix of jobs, each a part of the suite (`--shard K/N`), within
# a runner's time and its 16 GB; their results each job's artifact. And guest/sim whole, which CI
# runs whole only when what it tests changed (scripts/guest-sim-scope.py): 3,000 seeds of each of
# its seeded tests, and its sweep, every call of every run of one failing.
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # What the suite boots and serves its guests with, built once for its parts: the guest tests'
  # own tests are CI's guest part's, which scripts/test-e2e.sh runs first unless its artifacts are
  # prebuilt. Firecracker for musl under its real seccomp filter, and its jailer.
  guest-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # With vendor/firecracker, the VMM the guests boot in.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/guest-host
      - uses: ./.github/actions/guest-kernel
        id: kernel
      # In a tarball, which keeps their modes, as an artifact's files alone don't.
      - name: Build the suite's artifacts
        run: |
          FXDAX_E2E_BUILD_ONLY="$HOME/guest/artifacts" scripts/test-e2e.sh
          cp "$VMLINUX" ~/guest/vmlinux
          tar -C ~/guest -cf ~/guest.tar .
        env:
          VMLINUX: ${{ steps.kernel.outputs.vmlinux }}
      - uses: actions/upload-artifact@v7
        with:
          name: guest-artifacts
          path: ~/guest.tar
          retention-days: 3

  # The suite's parts, a job each, every Nth case from the Kth (`runner list --shard`), so that
  # none outlasts a runner's 6 h nor shares its 16 GB with more than its part, whichever way the
  # suite grows; more parts if one does. Each as root, as the guest part's tests run: podman makes
  # the guests' root images, and the jailer's jail is root's to make.
  guest-suites:
    name: guest-suites (${{ matrix.part }}/${{ strategy.job-total }})
    needs: guest-build
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.part }}/${{ strategy.job-total }}
      WORK: /mnt/nightly
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/guest-host
      - uses: actions/download-artifact@v8
        with:
          name: guest-artifacts
      # In /mnt, which the jailed VMs' user reaches, unlike the runner's home, its user's alone:
      # the VMs bind their sockets beside the cases' logs, and their API's in the temporary
      # directory, everyone's to write in, as /tmp is.
      - name: Unpack the artifacts
        run: |
          sudo mkdir -p "$WORK/tmp"
          sudo chown -R "$USER" "$WORK"
          chmod 1777 "$WORK/tmp"
          tar -C "$WORK" -xf guest.tar
          rm guest.tar
          cat "$WORK/artifacts/artifacts.txt"
      # The host's memory, swap, I/O and CPU every minute, in this log, which outlives a runner
      # that runs out of them.
      - name: The guest suites, part ${{ env.SHARD }}
        timeout-minutes: 300
        run: |
          vmstat -w -t 60 &
          sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" "TMPDIR=$WORK/tmp" \
            "FXDAX_E2E_PREBUILT=$WORK/artifacts" "FXDAX_GUEST_KERNEL=$WORK/vmlinux" \
            FXDAX_FIRECRACKER_JAIL=1 FXDAX_FIRECRACKER_SECCOMP=real \
            "FXDAX_E2E_RESULTS=$WORK/results" \
            scripts/test-e2e-rustfs.sh --tag nightly --shard "$SHARD"
      # What the cases said, but for their stores, images and caches: the runner's user's, as
      # root's guest roots' directories aren't readable to it.
      - name: Give the results to the runner's user
        if: always()
        run: sudo chown -R "$USER" "$WORK"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guest-suites-${{ matrix.part }}
          path: |
            /mnt/nightly/results/**/*.txt
            /mnt/nightly/results/**/*.log
            /mnt/nightly/results/**/*.json

  # guest/sim's 3,000 seeds, as CI runs them when what they test changed (TASK-149.14).
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: The mutants apply
        run: guest/sim/mutants.sh --check
      - name: Run 3,000 seeds of each
        run: guest/sim/zloop.sh -s 3000 -d "$BUILD/logs"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs

  # guest/sim's whole sweep, as CI runs it when what it tests changed (TASK-149.15).
  guest-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: Fail each call of every run of one in turn
        run: guest/sim/sweep.sh -d "$BUILD/sweep"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-sweep-logs
          path: target/sim/sweep
