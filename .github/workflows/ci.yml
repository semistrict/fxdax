# Does it compile, and do its tests pass: scripts/test.sh, as on a laptop, a part a job. No guest
# kernels nor VMs, which need nested KVM and run on GCE (scripts/test-gce.sh).
name: CI

on:
  push:
    branches: [main]
    # fxdax: a push of backlog notes alone tests nothing new: what reaches main has passed its
    # land-X branch's run first. Their runs queued ahead of land-X branches' for half an hour.
    paths-ignore: ['backlog/**', 'OPEN_QUESTIONS.md']
  pull_request:
  workflow_dispatch:
    inputs:
      guest-sim:
        description: guest/sim's jobs whole, a smoke run, or as what they test changed
        type: choice
        options: [auto, full, smoke]
        default: auto

# fxdax: a newer run of a ref replaces an older one still going: a push to main, or a land-X branch
# pushed again, makes the older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.parts }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The workspace's suite, a quarter of an hour of tests; the simulation of the bucket's
        # protocol, extent_store's (TASK-88), whose
        # seed searches took most of an hour in the suite's unoptimized build, an optimized build of
        # its own (TASK-188); the Shuttle suites, each built with its crate's feature, a build of
        # their own; the guest tests' own, a workspace of their own; the Go client, its generated
        # code checked against the .proto, and its tests against the daemon, which it builds
        # (TASK-219); the VMM's own that fxdax adds to, vendor/firecracker's workspace, which ran
        # on GCE alone and broke unseen there (TASK-220); the rest, minutes.
        parts: [workspace, sim, shuttle, clippy scripts, guest, go, firecracker]
        # What a part's tests run beyond what every part builds with: Coccinelle, whose rules the
        # scripts' tests check; xfsprogs, for the guest tests' own of reflinks; libclang, which the
        # VMM's userfaultfd-sys builds its bindings with (bindgen). Coccinelle and its
        # OCaml are three quarters of the downloads: every part fetching them, a slow mirror (57
        # kB/s) took 40 minutes of the workspace's 90 (run 42089880804, TASK-172).
        include:
          - parts: clippy scripts
            packages: coccinelle
          - parts: guest
            packages: xfsprogs
          - parts: firecracker
            packages: libclang-dev
    env:
      FXDAX_TEST_PARTS: ${{ matrix.parts }}
    steps:
      # With vendor/firecracker, whose seccompiler fxdax's tests compile Firecracker's seccomp
      # filters with, to run the VMM's side of DAX windows under them (TASK-149.28).
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install the build's tools
        # elfutils' eu-stack and sqlite3, which tests run, as on the GCE hosts
        # (scripts/lib/linux-host-setup.sh); fuse3's fusermount3, which mounts the FUSE tests'
        # stores for the runner's user (crates/fxdax/tests/fuse_mount.rs); libseccomp, which
        # Firecracker's seccompiler links; and the part's own (matrix.packages). No protoc, which protox stands in for
        # (crates/fxdax/build.rs), nor libclang, which no bindgen of fxdax's workspace or the guest
        # tests' needs: the VMM's alone, its part's own.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang elfutils sqlite3 fuse3 libseccomp-dev ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Go's latest: go/generate.sh's buf may want a newer Go than go.mod, which `go run` would
      # fetch.
      - uses: actions/setup-go@v7
        if: matrix.parts == 'go'
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            guest/tests/target
          key: cargo-${{ runner.os }}-${{ matrix.parts }}-${{ hashFiles('Cargo.lock', 'guest/tests/Cargo.lock', 'vendor/firecracker.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.parts }}-
      # The guest's half for its own target too, as the guest agent is built (scripts/test-e2e.sh):
      # its tests run on the host's in scripts/test.sh.
      - name: Compile the guest tests for the guest
        if: matrix.parts == 'guest'
        working-directory: guest/tests
        run: cargo check -p test_cases --features guest --tests --target x86_64-unknown-linux-musl
      # DAX's tests take faults through /dev/userfaultfd, root's alone on the runner, as
      # scripts/lima-setup.sh gives it to the kvm group.
      - name: Let the tests use userfaultfd
        run: sudo setfacl -m "u:$USER:rw" /dev/userfaultfd
      # The tests' stores on the root disk, which has room: in /tmp, three extentd tests ran out of
      # it (ENOSPC).
      - name: Give the tests' files room
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          echo TMPDIR=/mnt/tmp >> "$GITHUB_ENV"
          df -h /tmp /mnt
      # Every failure, not the first alone: a run is long. The guest tests' own as root, as on the
      # GCE hosts: some mount a loop device, to hold a script's model to a kernel's filesystem.
      - name: scripts/test.sh
        run: |
          if [[ $FXDAX_TEST_PARTS == guest ]]; then
            sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" scripts/test.sh --no-fail-fast
          else
            scripts/test.sh --no-fail-fast
          fi

  # pjdfstest (BSD-2-Clause) on FUSE mounts of new stores, as root, in a directory of the mount
  # and from its root: the host's Node layer, fxfs-posix under it and fxdax::fuse's server held to
  # POSIX's permissions, owners, times and errnos, which the guest's pjdfstest case checks only on
  # GCE (TASK-149.38). Failures but scripts/pjdfstest-fuse-known's fail it. A debug build, its
  # assertions and overflow checks on.
  # The workspace's suite and the Shuttle suites on macOS, scripts/test.sh's parts as a Mac runs
  # them: what fxdax compiles for macOS alone, and its tests, ran on laptops alone, so a regression
  # there landed green (TASK-149.20.2): physmem's physical map, extent_store's syncs (F_FULLFSYNC),
  # extent_remote's cache, fxdax's storage I/O. The guest's, the VMM's and the daemon's are Linux's.
  macos:
    name: macos (${{ matrix.parts }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parts: [workspace, shuttle]
    env:
      FXDAX_TEST_PARTS: ${{ matrix.parts }}
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.parts }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.parts }}-
      # Every failure, not the first alone. Within macOS's 256 open files a process, as the
      # stores', the remotes' and physmem's tests were run within, all passing (TASK-149.20.2).
      - name: scripts/test.sh
        run: scripts/test.sh --no-fail-fast

  pjdfstest-fuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@v7
        with:
          submodules: true
      # pjdfstest's build (autotools, a C compiler) and prove (perl's), fuse3 for /dev/fuse's
      # helpers, clang as every part builds with.
      - name: Install the build's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang fuse3 autoconf automake gcc make perl
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-pjdfstest-fuse-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-pjdfstest-fuse-
      - name: Build fxdax-mount
        run: cargo build --locked -p fxdax --bin fxdax-mount
      - name: pjdfstest on FUSE mounts of new stores, as root
        run: sudo --preserve-env env "PATH=$PATH" scripts/pjdfstest-fuse.py target/debug/fxdax-mount
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pjdfstest-fuse-logs
          path: target/pjdfstest/*.log

  # vendor/firecracker only goes forward: b781ff302 took main's back to before F_SEAL, and nothing
  # here builds Firecracker to notice (TASK-166).
  # The tests over real object stores, which the workspace's run ignores as they need a server:
  # RustFS's S3 (Apache-2.0) and Azurite's Azure Blob Storage (MIT), each in a container, as
  # scripts/test-rustfs.sh and scripts/test-azurite.sh start them. Nothing ran them until
  # TASK-149.20, which found `fxdaxctl take` of a new copy at a later placement refused there.
  object-stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@v7
        with:
          submodules: true
      # libseccomp, which Firecracker's seccompiler links, a dependency of fxdax's tests.
      - name: Install the build's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libseccomp-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-object-stores-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-object-stores-
      - name: The S3 tests, against RustFS
        run: scripts/test-rustfs.sh --no-fail-fast
      - name: The Azure tests, against Azurite
        run: scripts/test-azurite.sh --no-fail-fast

  # TASK-330.3: the extent daemon against a degraded bucket, five minutes of it, its VM processes
  # writing all the while (extentd::tests::soak): its memory within its budget, the bucket's
  # failures said, commits waiting at the lag bound and none failing, everything uploaded once the
  # bucket answers, no VM process let go. The workspace's suite leaves it out, as it would outlast
  # it; Hunt runs it for half an hour each night. On the root disk, which has room for what it
  # writes, some 7 GiB.
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FXDAX_SOAK_SECS: 300
    steps:
      # With vendor/firecracker, whose seccompiler fxdax's tests build with (TASK-149.28).
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install the build's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libseccomp-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-soak-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-soak-
      - name: Give the soak's files room
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          echo TMPDIR=/mnt/tmp >> "$GITHUB_ENV"
          df -h /mnt
      - name: Build
        run: cargo nextest run -p fxdax --lib --no-run
      - name: The daemon against a degraded bucket, five minutes
        run: >-
          cargo nextest run -p fxdax --lib --run-ignored all --no-capture
          -E 'test(=extentd::tests::soak::a_degraded_bucket_costs_the_daemon_nothing_it_does_not_bound)'

  # guide/: the codebase guide, which cites code by exact snippets. Its build fails when a snippet
  # no longer occurs exactly once in its file, or evidence it cites is gone, so code changes that
  # leave it pointing at nothing fail here, not in a reader's hands.
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: guide
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: guide/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: guide/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  firecracker-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: vendor/firecracker is ahead of the base's
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z $BASE || $BASE == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          scripts/firecracker-forward.sh "$BASE" HEAD

  # Every commit of the Firecracker series builds both ways, as it promises those who take it onto
  # forks of their own (TASK-269): without its fxdax feature outside this checkout, with it as fxdax
  # builds it (scripts/firecracker-series-check.sh), from its upstream release up; when
  # vendor/firecracker moved, or the run was asked for by hand, a build of each commit.
  firecracker-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Whether vendor/firecracker moved
        id: moved
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z $BASE || $BASE == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          # A run asked for by hand checks the series whatever moved.
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch &&
                $(git rev-parse "$BASE:vendor/firecracker") == $(git rev-parse HEAD:vendor/firecracker) ]]; then
            echo moved=false >> "$GITHUB_OUTPUT"
          else
            echo moved=true >> "$GITHUB_OUTPUT"
          fi
      - name: Install the build's tools
        if: steps.moved.outputs.moved == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libseccomp-dev
      # The series' history, down to the upstream release it is on (vendor/firecracker.base, by
      # commit: the fork need have no tag of it), and its toolchain with clippy.
      - name: Fetch the series
        if: steps.moved.outputs.moved == 'true'
        run: |
          git -C vendor/firecracker fetch --unshallow origin || git -C vendor/firecracker fetch origin
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' vendor/firecracker/rust-toolchain.toml)" \
            --profile minimal -c clippy
      - name: scripts/firecracker-series-check.sh
        if: steps.moved.outputs.moved == 'true'
        run: scripts/firecracker-series-check.sh

  # guest/sim: dax.c in a process, over a fake kernel, as zloop.sh runs ztest (TASK-149.14). Its
  # 3,000 seeds when what it tests changed since the base (scripts/guest-sim-scope.py), else 200: the
  # whole took half an hour, CI's wall time, and the nightly workflow runs it whole every day.
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whole, or a smoke run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FXDAX_GUEST_SIM: ${{ inputs.guest-sim }}
        run: echo "scope=$(scripts/guest-sim-scope.py "$BASE")" | tee -a "$GITHUB_OUTPUT"
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      # First, as it takes seconds: a past bug whose patch no longer applies would test nothing.
      - name: The mutants apply
        run: guest/sim/mutants.sh --check
      - name: Run the seeds of each, 3,000 or 200
        env:
          SEEDS: ${{ steps.scope.outputs.scope == 'full' && 3000 || 200 }}
        run: guest/sim/zloop.sh -s "$SEEDS" -d "$BUILD/logs"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs

  # guest/sim's sweep (TASK-149.15): each run of one, each of its calls that may fail failing in
  # turn, 17,000 runs, a job of its own beside guest-sim's seeds: all of them when what it tests
  # changed since the base, else a twelfth, every 12th call of each run from one the run's number
  # says, so that twelve runs of CI go through them all; the nightly workflow sweeps them all daily.
  guest-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Whole, or a smoke run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FXDAX_GUEST_SIM: ${{ inputs.guest-sim }}
        run: echo "scope=$(scripts/guest-sim-scope.py "$BASE")" | tee -a "$GITHUB_OUTPUT"
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: Fail each call of every run of one in turn, or a twelfth of them
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [[ $SCOPE == full ]]; then
            guest/sim/sweep.sh -d "$BUILD/sweep"
          else
            guest/sim/sweep.sh -s "$GITHUB_RUN_NUMBER/12" -d "$BUILD/sweep"
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-sweep-logs
          path: target/sim/sweep
