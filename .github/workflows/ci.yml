# Does it compile, and do its unit tests pass: no guest kernels nor VMs, which need nested KVM and
# run on GCE (scripts/test-gce.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UCD_ZIP: ${{ github.workspace }}/target/UCD-12.1.0.zip
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Fetch the Unicode Character Database
        run: |
          mkdir -p target
          [ -f "$UCD_ZIP" ] || curl -fsSL -o "$UCD_ZIP" https://www.unicode.org/Public/12.1.0/ucd/UCD.zip
          echo "25ba51a0d4c6fa41047b7a5e5733068d4a734588f055f61e85f450097834a0a6  $UCD_ZIP" | sha256sum -c -
      - name: Compile
        run: cargo check --workspace
      - name: Compile the guest tests, both halves
        working-directory: guest/tests
        run: |
          cargo check -p test_cases --features host
          cargo check -p test_cases --features guest --tests --target x86_64-unknown-linux-musl
      # DAX's tests take faults through /dev/userfaultfd, root's alone on the runner, as
      # scripts/lima-setup.sh gives it to the kvm group.
      - name: Let the tests use userfaultfd
        run: sudo setfacl -m "u:$USER:rw" /dev/userfaultfd
      # The tests' stores, on the runner's scratch disk: on the root disk, beside the build, they
      # ran out of room (ENOSPC, three extentd tests failing).
      - name: Give the tests' files the scratch disk
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          echo TMPDIR=/mnt/tmp >> "$GITHUB_ENV"
          df -h / /mnt
      - name: Unit tests
        run: cargo nextest run --workspace

  # guest/sim: dax.c in a process, over a fake kernel, as zloop.sh runs ztest (TASK-149.14).
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the build's tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: actions/cache@v6
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$PWD/target/sim-kernel"
      - name: Run 3,000 seeds
        env:
          KERNEL: ${{ github.workspace }}/target/sim-kernel
          BUILD: ${{ github.workspace }}/target/sim
        run: guest/sim/zloop.sh -s 3000 -d "$BUILD/logs"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs
