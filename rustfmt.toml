# Fuchsia's rustfmt.toml, so that code copied from Fuchsia keeps its formatting. Fuchsia also sets
# `imports_granularity = "Module"`, which needs a nightly rustfmt.

# While Fuchsia mostly uses 2021 edition, allow use of 2024 features.
edition = "2024"

# The "Default" setting has a heuristic which splits lines too aggresively.
# We are willing to revisit this setting in future versions of rustfmt.
# Bugs:
#   * https://github.com/rust-lang/rustfmt/issues/3119
#   * https://github.com/rust-lang/rustfmt/issues/3120
use_small_heuristics = "Max"

# Prevent carriage returns
newline_style = "Unix"
