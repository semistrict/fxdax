# fxdax's own: the concurrency protocol of live read-only followers (backlog doc-8, Concurrency;
# TASK-42.5): how a follower applies its writer's commits while readers read, without a lock
# stalling them, over a small trait of the kernel's operations, which the guest implements with the
# kernel's primitives and tests with Shuttle's.
[package]
name = "follower"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# The protocol's rules settable (`set_rules`), and its tests, under Shuttle (awslabs/shuttle).
shuttle = ["dep:shuttle"]

[dependencies]
anyhow.workspace = true
shuttle = { workspace = true, optional = true }

[lints]
workspace = true
