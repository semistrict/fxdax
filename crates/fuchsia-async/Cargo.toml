# Fuchsia's `src/lib/fuchsia-async/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "fuchsia-async"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The sanitizer variants Fuchsia's build selects; never enabled here.
variant_asan = []
variant_hwasan = []

[dependencies]
fuchsia-async-macro.workspace = true
fuchsia-emulated-handle.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
futures-lite.workspace = true
pin-project-lite.workspace = true
smallvec.workspace = true

# The portable runtime's; the guest kernel (fxdax's TASK-26.6) has a runtime of its own.
[target.'cfg(not(target_os = "none"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
linux-rt = { path = "../../guest/rust/linux-rt" }

[dev-dependencies]
assert_matches.workspace = true
futures-test.workspace = true
rand.workspace = true

[lints]
workspace = true
