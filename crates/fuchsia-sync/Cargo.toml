# Fuchsia's `src/lib/fuchsia-sync/src` at workspace.metadata.fuchsia.commit: the files the workspace
# builds.
[package]
name = "fuchsia-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lock_api.workspace = true

# The guest kernel's (fxdax's TASK-26.6) are its std's, over the kernel's futexes: parking_lot's
# parker spins there.
[target.'cfg(not(target_os = "none"))'.dependencies]
parking_lot.workspace = true
parking_lot_core.workspace = true

[dev-dependencies]
crossbeam.workspace = true

[lints]
workspace = true
