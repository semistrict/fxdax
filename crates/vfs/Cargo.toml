# Parts of Fuchsia's vfs library, `src/storage/lib/vfs/rust/src` at
# workspace.metadata.fuchsia.commit: some files copied, the rest excerpts and stand-ins (see
# src/lib.rs).
[package]
name = "vfs"
version = "0.1.0"
edition.workspace = true
# Fuchsia's vfs library is BSD licensed.
license.workspace = true
publish = false

[features]
# Upstream's FDomain support, which is never enabled here.
fdomain = []

[dependencies]
fidl.workspace = true
fidl-fuchsia-io.workspace = true
flex_client.workspace = true
fuchsia-async.workspace = true
fuchsia-emulated-handle.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
libc.workspace = true
name.workspace = true
paste.workspace = true
pin-project.workspace = true
static_assertions.workspace = true
zx.workspace = true
zx-status.workspace = true

[dev-dependencies]
assert_matches.workspace = true
fuchsia.workspace = true

[lints]
workspace = true
