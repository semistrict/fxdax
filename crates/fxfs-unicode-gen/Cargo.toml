# Unicode tables for fxfs-unicode, generated from UCD 12.1.0 by
# scripts/generate-unicode-tables.sh. Fuchsia generates them at build time.
[package]
name = "fxfs-unicode-gen"
version = "0.1.0"
edition.workspace = true
license = "BSD-3-Clause AND Unicode-3.0"

[lib]
name = "unicode_gen"

[dependencies]
types = { package = "fxfs-unicode-types", path = "../fxfs-unicode-types" }

[lints]
workspace = true
