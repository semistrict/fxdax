# fxdax's own: branches of extent stores kept in object storage (backlog doc-7, TASK-28).
[package]
name = "extent_remote"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bincode.workspace = true
bytes = "1.12.1"
extent_frame.workspace = true
fail = "0.5.1"
futures.workspace = true
humantime = "2.4.0"
hyper = { version = "1.12.0", default-features = false }
imbl = { version = "7.0.2", features = ["serde"] }
libc.workspace = true
log.workspace = true
object_store.workspace = true
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
rand.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde.workspace = true
storage_device.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
