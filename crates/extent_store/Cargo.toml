# fxdax's own: a local extent store, as backlog doc-4's host keeps extents (TASK-26.10).
[package]
name = "extent_store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bincode.workspace = true
event-listener.workspace = true
extent_frame.workspace = true
extent_remote.workspace = true
fail = "0.5.1"
futures.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
rapidhash.workspace = true
serde.workspace = true
shuttle = { workspace = true, optional = true }
storage_device.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# The simulation of doc-7's protocol over its stores (src/sim, TASK-88): a bucket whose requests
# take effect when it says, and the protocol's rules, which it turns off.
extent_remote = { workspace = true, features = ["testing"] }
# Its own tests audit the store's counts (the `audit` feature).
extent_store = { path = ".", features = ["audit"] }
# And set its failpoints (TASK-189).
fail = { version = "0.5.1", features = ["failpoints"] }
object_store.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# The store's locks and condition variables are Shuttle's, whose scheduler chooses every
# interleaving of its threads, and its rules may be turned off (tests/shuttle/, TASK-44.4). Only
# for those tests: Shuttle's primitives work only in a Shuttle test.
shuttle = ["dep:shuttle", "audit"]
# fxdax: the store recounts each count it keeps of its state as each critical section ends, and
# panics if one drifted (State::audit, TASK-160.16): for tests, whose stores are small, as it goes
# through all the branch holds each time. Its own tests, the Shuttle and crash tests among them,
# turn it on.
audit = []
# fxdax: tests' panics holding a lock shared beyond one store (shared::testing, TASK-149.24): fxdax's
# tests have it.
testing = []
