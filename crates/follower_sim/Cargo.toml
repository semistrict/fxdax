# fxdax's own: the deterministic simulation of live read-only followers (backlog doc-8, testing
# 3; TASK-42.1): the real Fxfs as writer and follower on one extent store, and readers, under
# Shuttle's scheduler. Its tests run with the `shuttle` feature alone:
# `cargo nextest run -p follower_sim --features shuttle`.
[package]
name = "follower_sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Fxfs's executor, tasks, timers and locks, and the extent store's, as Shuttle's.
shuttle = [
    "dep:shuttle",
    "fuchsia-async/shuttle",
    "fuchsia-sync/shuttle",
    "extent_store/shuttle",
    "fxfs/shuttle",
    "follower/shuttle",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
extent_store.workspace = true
follower.workspace = true
follower_history.workspace = true
fuchsia-async.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
fxfs.workspace = true
shuttle = { workspace = true, optional = true }
storage_device.workspace = true

[lints]
workspace = true
