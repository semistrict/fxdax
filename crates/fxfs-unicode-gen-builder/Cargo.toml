# Builds the vendored Unicode table generator; see scripts/generate-unicode-tables.sh.
[package]
name = "fxfs-unicode-gen-builder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "unicode_gen_builder"
path = "../../vendor/fuchsia/src/storage/fxfs/unicode/src/generator.rs"

[dependencies]
# Selects the zlib backend Fuchsia uses for zip.
flate2.workspace = true
regex.workspace = true
types = { package = "fxfs-unicode-types", path = "../fxfs-unicode-types" }
zip.workspace = true

[lints]
workspace = true
