# Fuchsia's `src/storage/fxfs/unicode/src/generator.rs` at workspace.metadata.fuchsia.commit: the
# files the workspace builds.
# Builds Fxfs's Unicode table generator; see scripts/generate-unicode-tables.sh.
[package]
name = "fxfs-unicode-gen-builder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "unicode_gen_builder"
path = "src/generator.rs"
# Its tests compare against ICU data from a full Fuchsia checkout.
test = false

[dependencies]
# Selects the zlib backend Fuchsia uses for zip.
flate2.workspace = true
regex.workspace = true
types = { package = "fxfs-unicode-types", path = "../fxfs-unicode-types" }
zip.workspace = true

[lints]
workspace = true

# flate2 has no `use`: it selects zip's zlib backend, as Fuchsia's build does.
[package.metadata.cargo-machete]
ignored = ["flate2"]
