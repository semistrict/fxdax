# The extent daemon and the host's side of Fxfs: Fuchsia's filesystem, which guests run in their
# own kernels over extent stores.
[package]
name = "fxdax"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Images for tests of importing them, here and in the guest's (`import::testing`).
testing = []
# The extent daemon's registry of open stores and its requests on them (open_stores and
# store_requests, TASK-44.6), and the kernel and its DAX windows, with their userfaultfd stage (dax,
# TASK-44.3), on Shuttle's locks, whose scheduler then chooses every interleaving of their tests'
# threads. Only for those tests: `cargo nextest run -p fxdax --features shuttle --lib
# shuttle_tests::`.
shuttle = ["dep:shuttle", "physmem/shuttle"]
# fxdax: the failpoints (the fail crate's) of the extent daemon's requests, and of the steps of a
# fork's protocol here and in extent_store and extent_remote (`faults`), which the FAILPOINTS
# environment variable sets, or FXDAX_FAULT_SEED from a seed: a request of a kind failing or
# waiting, or a step failing, as configured (TASK-44.10). Without the feature they are nothing:
# scripts/test-e2e.sh builds the daemon with it for FXDAX_FAILPOINTS, in the sim profile, as a
# release build refuses it (extent_remote, TASK-320). This crate's tests have it, and so its
# examples would: they are fxdax-examples'.
failpoints = ["fail/failpoints"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
bitflags.workspace = true
fuchsia-async.workspace = true
futures.workspace = true
fxfs.workspace = true
fxfs-posix.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
physmem.workspace = true
pin-project-lite.workspace = true
storage_device.workspace = true
zerocopy.workspace = true
async-trait.workspace = true
event-listener.workspace = true
extent_remote.workspace = true
extent_frame.workspace = true
extent_store.workspace = true
tokio.workspace = true
url.workspace = true
tar = { version = "0.4.46", default-features = false }
flate2.workspace = true
sha2.workspace = true
siphasher.workspace = true
serde.workspace = true
serde_json = "1.0.154"
shuttle = { workspace = true, optional = true }
fail = "0.5.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
humantime = "2.4.0"

[dev-dependencies]
async-trait.workspace = true
fxdax = { path = ".", features = ["failpoints", "testing"] }
# Panics holding a lock shared beyond one store, in tests that ask (TASK-149.24).
extent_store = { workspace = true, features = ["testing"] }
# Tests' branches, of a cell of their own (`layout::test_branch`, TASK-364).
extent_remote = { workspace = true, features = ["testing"] }
# What the hostile VM process test looks for in the memory it is given (TASK-149.17).
memchr.workspace = true
object_store.workspace = true
proptest.workspace = true
tempfile.workspace = true
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-task = "4.7.1"
hyper-util = { version = "0.1.21", features = ["tokio"] }
io-uring = "0.7.15"
prost = "0.14.4"
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5.3"

# Firecracker's seccompiler (Apache-2.0, vendor/firecracker), which compiles its production seccomp
# filters, to run the VMM's side of DAX windows under them (tests/seccomp.rs, TASK-149.28). It
# links libseccomp (LGPL-2.1), which macOS lacks.
[target.'cfg(target_os = "linux")'.dev-dependencies]
seccompiler = { path = "../../vendor/firecracker/src/seccompiler" }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.6"
