# Fuchsia's Fxfs filesystem, for VMMs' virtio-fs devices with DAX.
[package]
name = "fxdax"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Images for tests of importing them, here and in the guest's (`import::testing`).
testing = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
bitflags.workspace = true
fidl.workspace = true
fidl-fuchsia-fs-startup.workspace = true
fidl-fuchsia-io.workspace = true
fuchsia-async.workspace = true
futures.workspace = true
fxfs.workspace = true
fxfs-platform.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
refaults_vmo.workspace = true
storage_device.workspace = true
zircon.workspace = true
zx.workspace = true
zerocopy.workspace = true
async-trait.workspace = true
event-listener.workspace = true
extent_remote.workspace = true
extent_frame.workspace = true
extent_store.workspace = true
tokio.workspace = true
vfs.workspace = true
tar = { version = "0.4.46", default-features = false }
flate2.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json = "1.0.154"

[dev-dependencies]
async-trait.workspace = true
fxdax = { path = ".", features = ["testing"] }
object_store.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.15"
