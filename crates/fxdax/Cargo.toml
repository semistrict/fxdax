# Fuchsia's Fxfs filesystem, for VMMs' virtio-fs devices with DAX.
[package]
name = "fxdax"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Images for tests of importing them, here and in the guest's (`import::testing`).
testing = []
# The extent daemon's registry of open stores (open_stores, TASK-44.6) and the kernel
# (TASK-44.3) on Shuttle's locks, whose scheduler then chooses every interleaving of their
# tests' threads. Only for those tests: `cargo nextest run -p fxdax --features shuttle --lib
# shuttle_tests::`.
shuttle = ["dep:shuttle", "zircon/shuttle"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
bitflags.workspace = true
fidl.workspace = true
fidl-fuchsia-fs-startup.workspace = true
fidl-fuchsia-io.workspace = true
fuchsia-async.workspace = true
futures.workspace = true
fxfs.workspace = true
fxfs-platform.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
refaults_vmo.workspace = true
storage_device.workspace = true
zircon.workspace = true
zx.workspace = true
zerocopy.workspace = true
async-trait.workspace = true
event-listener.workspace = true
extent_remote.workspace = true
extent_frame.workspace = true
extent_store.workspace = true
tokio.workspace = true
vfs.workspace = true
tar = { version = "0.4.46", default-features = false }
flate2.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json = "1.0.154"
shuttle = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
fxdax = { path = ".", features = ["testing"] }
object_store.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
io-uring = "0.7.15"
prost = "0.14.4"
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5.3"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.6"
