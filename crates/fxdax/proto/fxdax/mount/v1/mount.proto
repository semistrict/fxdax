// The control API of a host FUSE mount of many stores (TASK-302), of tenants' cells (TASK-364):
// `fxdax-mount --control SOCKET --stores DIR MOUNTPOINT` serves one FUSE mount, however many
// stores: one OS mount, not one per store. Attach takes a cell of the mount's bucket, as its
// holder, and every Fxfs volume of it into a store at DIR/TENANT/CELL/VOLUME, its lease with it,
// each shown at MOUNTPOINT/TENANT/CELL/VOLUME, TENANT and CELL in 16 hexadecimal digits as the
// bucket's keys have them; Detach writes them back, so that a VM, or another mount, may take the
// cell. A cell's other volumes are not shown: its SQLite volumes' databases open through
// sqlite_extents' VFS alone, and its volumes VMs attach are theirs, on the same host.
//
// It is served over a Unix socket, the mounting user's alone, mode 0600 whatever its umask, as
// every caller may do everything.
//
// Errors are gRPC statuses whose code follows the errno the mount failed with, which the
// `fxdax-errno` metadata entry carries, as a decimal number (Linux's), as the extent daemon's
// control API has them (fxdax/extentd/v1/extentd.proto): ENOENT is NOT_FOUND, EEXIST
// ALREADY_EXISTS, EACCES and EPERM PERMISSION_DENIED, EINVAL INVALID_ARGUMENT, ENOSPC
// RESOURCE_EXHAUSTED, ETIMEDOUT DEADLINE_EXCEEDED, EBUSY, ESTALE, ENOTSUP and EROFS
// FAILED_PRECONDITION, EIO and others INTERNAL.
//
// Calls block for as long as their work takes: an attach while its stores recover, a detach until
// the kernel lets the stores go. A caller bounds them with deadlines; one that gives up does not
// stop the work, which completes, or fails, on its own.
//
// Compatibility: cells changed v1 outright (TASK-364: formats break, no caller is kept); it only
// grows from here.

syntax = "proto3";

package fxdax.mount.v1;

// Its Go package, go/mount/v1, generated from this file (go/generate.sh).
option go_package = "github.com/semistrict/fxdax/go/mount/v1;mountv1";

// The control API of a FUSE mount of many stores.
service Mount {
  // Attaches a cell of the mount's bucket: takes it, as its holder, and every Fxfs volume of it
  // into a store at DIR/TENANT/CELL/VOLUME, opened again where one is, its lease with it, each
  // shown at MOUNTPOINT/TENANT/CELL/VOLUME. A cell of 0 is a new one, of no volumes yet.
  // ALREADY_EXISTS if the cell is attached; EBUSY if it is being attached or detached; NOT_FOUND if
  // the bucket has no such cell; ESTALE if a later placement holds it. A cell attached part way
  // detaches what it attached, at once, and fails.
  rpc Attach(AttachRequest) returns (AttachResponse);
  // Makes a new Fxfs volume of a cell attached: a new branch of it, its filesystem empty, its
  // root directory the mounting user's, in a store at DIR/TENANT/CELL/NAME, shown at
  // MOUNTPOINT/TENANT/CELL/NAME. NOT_FOUND if the cell is not attached; ALREADY_EXISTS if it has
  // a volume of the name; INVALID_ARGUMENT for a name no volume has.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  // Detaches a cell: its volumes go from the mount at once; each store is unmounted, what is
  // dirty written back, once the kernel has let go of every file and directory of it, as once
  // whatever has one open, or as its current directory, lets it go: the call returns then.
  // NOT_FOUND if the cell is not attached; EBUSY if it is being attached or detached. DIR stays,
  // to attach again.
  rpc Detach(DetachRequest) returns (DetachResponse);
  // The cells attached, and their volumes shown.
  rpc List(ListRequest) returns (ListResponse);
}

// What to attach.
message AttachRequest {
  // The tenant.
  uint64 tenant = 1;
  // Its cell, or 0 for a new cell of the tenant's.
  uint64 cell = 2;
  // The fencing token of the placement to take the cell at, if any: as CreateStore's.
  optional uint64 token = 3;
}

// What was attached.
message AttachResponse {
  // The cell: the one asked for, or the new one made.
  uint64 cell = 1;
  // Its volumes shown, by name.
  repeated Volume volumes = 2;
}

// What volume to make, and in what cell.
message CreateVolumeRequest {
  // The tenant.
  uint64 tenant = 1;
  // Its cell, attached.
  uint64 cell = 2;
  // Its name in the cell, and the mount: 1 to 64 ASCII letters, digits, '.', '_' or '-', not
  // starting with '.' (INVALID_ARGUMENT otherwise).
  string name = 3;
  // The most bytes its store holds: as VMs' disks hold.
  uint64 capacity = 4;
}

// The volume made.
message CreateVolumeResponse {
  // Its branch, a new one of the cell's.
  uint64 branch = 1;
}

// What to detach.
message DetachRequest {
  // The tenant.
  uint64 tenant = 1;
  // Its cell, attached.
  uint64 cell = 2;
  // Unmount its stores at once, without waiting for the kernel to let go of them: files and
  // directories of them still open fail with ENOTCONN from then on.
  bool force = 3;
}

// A cell detached.
message DetachResponse {}

// No more than the call.
message ListRequest {}

// The cells attached.
message ListResponse {
  // By tenant, then cell.
  repeated AttachedCell cells = 1;
}

// A cell attached.
message AttachedCell {
  // The tenant.
  uint64 tenant = 1;
  // Its cell.
  uint64 cell = 2;
  // Its volumes shown, by name.
  repeated Volume volumes = 3;
}

// A volume of a cell, shown in the mount.
message Volume {
  // Its name in the cell.
  string name = 1;
  // The branch its store holds.
  uint64 branch = 2;
  // Whether it is being detached.
  bool detaching = 3;
}
