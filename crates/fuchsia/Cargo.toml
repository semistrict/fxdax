# Fuchsia's `src/lib/fuchsia/src` at workspace.metadata.fuchsia.commit: the files the workspace
# builds.
[package]
name = "fuchsia"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# The sanitizer variants Fuchsia's build selects; never enabled here.
variant_asan = []
variant_hwasan = []

[dependencies]
argh.workspace = true
diagnostics-log.workspace = true
fidl-fuchsia-diagnostics-types.workspace = true
fuchsia-async.workspace = true
fuchsia-macro.workspace = true
libc.workspace = true
log.workspace = true

[lints]
workspace = true
