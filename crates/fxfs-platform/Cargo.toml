# Fxfs's Fuchsia platform library (src/storage/fxfs/platform), in part: see src/lib.rs.
[package]
name = "fxfs-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test helpers for other crates, as upstream.
testing = ["dep:fxfs-insecure-crypto", "dep:fxfs_crypt_common", "dep:log"]

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
either.workspace = true
event-listener.workspace = true
fidl.workspace = true
fidl-fuchsia-fs.workspace = true
fidl-fuchsia-fs-startup.workspace = true
fidl-fuchsia-io.workspace = true
fidl-fuchsia-memorypressure.workspace = true
# The pager receives packets from the kernel's port.
fuchsia-async = { package = "fuchsia-async-kernel", path = "../fuchsia-async-kernel" }
fuchsia-sync.workspace = true
futures.workspace = true
fxfs.workspace = true
fxfs-crypto.workspace = true
fxfs-insecure-crypto = { workspace = true, optional = true }
fxfs_crypt_common = { workspace = true, optional = true }
fxfs_macros.workspace = true
fxfs_trace.workspace = true
fxfs-unicode.workspace = true
linked-hash-map.workspace = true
log = { workspace = true, optional = true }
memory-pressure-signaler.workspace = true
refaults_vmo.workspace = true
rustc-hash.workspace = true
scopeguard.workspace = true
storage_device.workspace = true
storage_units.workspace = true
vfs.workspace = true
zx.workspace = true

[dev-dependencies]
assert_matches.workspace = true
fuchsia.workspace = true
fuchsia-fs.workspace = true
fxfs-insecure-crypto.workspace = true
fxfs_crypt_common.workspace = true
log.workspace = true
rand.workspace = true
test_util.workspace = true

[lints]
workspace = true
