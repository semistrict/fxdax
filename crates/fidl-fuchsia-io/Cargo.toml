# Stands in for the Rust bindings Fuchsia generates from `sdk/fidl/fuchsia.io`, for the types and
# protocols Fxfs and its tests use.
[package]
name = "fidl-fuchsia-io"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "fidl_fuchsia_io"

[dependencies]
bitflags.workspace = true
fidl.workspace = true
futures.workspace = true
zx.workspace = true

# Synchronous proxies, which block on tokio, which the guest kernel (fxdax's TASK-26.6) has none of.
[target.'cfg(not(target_os = "none"))'.dependencies]
tokio.workspace = true

[lints]
workspace = true
