# Stands in for Fuchsia's process runtime library (src/lib/fuchsia-runtime), with the parts that
# the in-process kernel's runtime provides.
[package]
name = "fuchsia-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zx.workspace = true

# The in-process kernel; the guest kernel's Fxfs (fxdax's TASK-26.6) calls none of this.
[target.'cfg(not(target_os = "none"))'.dependencies]
zircon.workspace = true

[lints]
workspace = true
