[package]
name = "zircon"
version = "0.1.0"
edition.workspace = true
# Ported from the Zircon kernel, which is MIT licensed.
license = "MIT"
build = "build.rs"

[features]
# The kernel's locks, condition variables and threads as Shuttle's (awslabs/shuttle), whose
# scheduler then chooses every interleaving of a test's threads (TASK-44.3). Only for those tests:
# the kernel's own, `cargo nextest run -p zircon --features shuttle --lib shuttle_tests::`, and
# fxdax's. Cargo unifies the parking_lot wrapper's own `shuttle` feature for every crate of a build, so a
# build enabling fuchsia-sync's must enable this one too.
shuttle = ["parking_lot/shuttle", "dep:shuttle"]

[dependencies]
libc.workspace = true
page.workspace = true
# parking_lot itself without the `shuttle` feature; with it, Shuttle's locks behind parking_lot's
# API (Apache-2.0).
parking_lot = { package = "shuttle-parking_lot", version = "0.12.5", features = ["arc_lock"] }
shuttle = { workspace = true, optional = true }
zerocopy.workspace = true
zx-status.workspace = true
zx-types.workspace = true
zircon_macros.workspace = true

[dev-dependencies]
futures.workspace = true

[lints]
workspace = true
