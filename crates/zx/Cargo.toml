# Fuchsia's `sdk/rust/zx/src` at workspace.metadata.fuchsia.commit: the files the workspace builds.
[package]
name = "zx"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
# The tests need Fuchsia's component framework. The ones that can run here are
# copied into zircon-core-tests.
test = false
doctest = false

[dependencies]
bitflags.workspace = true
bstr.workspace = true
libc.workspace = true
static_assertions.workspace = true
zerocopy.workspace = true
zx-status.workspace = true
zx-status-ext.workspace = true
zx-sys.workspace = true

[lints]
workspace = true
