# Fuchsia's `src/storage/lib/storage_device/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "storage_device"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
block_protocol.workspace = true
event-listener.workspace = true
fprint.workspace = true
fuchsia-runtime.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
log.workspace = true
num.workspace = true
rand.workspace = true
serde.workspace = true
storage_ptr_slice.workspace = true
# fxdax: the errors of extent.rs.
thiserror.workspace = true
zx.workspace = true

[dev-dependencies]
fuchsia.workspace = true
fuchsia-async.workspace = true

# The workspace's lints.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(detect_lock_cycles)',
    'cfg(fuchsia_api_level_at_least, values(any()))',
    'cfg(fuchsia_api_level_less_than, values(any()))',
    'cfg(fuzz)',
    'cfg(fuzzing)',
    'cfg(vdso_next)',
] }
