# Fuchsia's `src/lib/fuchsia-emulated-handle/src` at workspace.metadata.fuchsia.commit: the files
# the workspace builds.
[package]
name = "fuchsia-emulated-handle"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bitflags.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
zx-status.workspace = true
zx-status-ext.workspace = true
zx-types.workspace = true

# Sockets' tokio I/O traits, which the guest kernel (fxdax's TASK-26.6) has no tokio for.
[target.'cfg(not(target_os = "none"))'.dependencies]
tokio.workspace = true

[dev-dependencies]
futures-test.workspace = true

[lints]
workspace = true
