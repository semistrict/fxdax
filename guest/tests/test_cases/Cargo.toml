[package]
name = "test_cases"
edition = "2024"

[features]
host = [
    "bytes",
    "fxdax",
    "extent_remote",
    "extent_store",
    "follower_history",
    "futures",
    "http-body-util",
    "hyper",
    "hyper-util",
    "serde",
    "serde_json",
    "tokio",
]
guest = ["serde_json"]

[lib]
name = "test_cases"

[dependencies]
macros = { path = "../macros" }
nix = { version = "0.29.0", features = ["fs", "socket", "ioctl"] }
anyhow = "1.0.95"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempdir = "0.3.7"
# fxdax's automounter of shared volumes, which the guest runs and whose asks the host answers
# (TASK-136.6).
fxfs-automount = { path = "../../../crates/fxfs-automount" }
# The fxdax repository whose guest tests these are.
fxdax = { path = "../../../crates/fxdax", optional = true, features = ["testing"] }
futures = { version = "0.3.34", optional = true }
# fxdax's extent store, whose directory the crash test takes before it copies it (TASK-129).
extent_store = { path = "../../../crates/extent_store", optional = true }
# fxdax's buckets, which fxfs-guest-soak measures (TASK-67), and the runtime it lists them on.
extent_remote = { path = "../../../crates/extent_remote", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "sync", "macros"] }
# fxdax's history checker of followers (TASK-42.1), which the followers' torture test's host runs.
follower_history = { path = "../../../crates/follower_history", optional = true }
# The S3 proxy a soak degrades its bucket through, in front of RustFS (TASK-330.4).
hyper = { version = "1.12.0", features = ["server", "client", "http1"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
bytes = { version = "1.12.1", optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
