# Rust that runs in the guest's Linux kernel (doc-2, TASK-26.1), built for the kernel's own targets
# on a pinned nightly, so it is a workspace of its own. scripts/build-guest-sysroot.sh builds std
# (with core and alloc, -Zbuild-std) into a sysroot, against which scripts/build-guest-kernel.sh
# builds the filesystem, Fxfs with it, and links it into the kernel.
[workspace]
resolver = "3"
members = ["fxfs-linux", "linux-rt", "std"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"

[workspace.dependencies]
linux-rt = { path = "linux-rt" }

# The kernel cannot unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# One object, holding only what the kernel's calls reach.
codegen-units = 1
lto = true
