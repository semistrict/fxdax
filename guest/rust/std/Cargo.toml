[package]
name = "linux-std"
version = "0.1.0"
edition.workspace = true
# Rust's std, in part (scripts/import-guest-std.py): MIT OR Apache-2.0, as Rust is.
license = "BSD-3-Clause AND (MIT OR Apache-2.0)"
publish = false

[lib]
name = "std"

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["nightly", "rustc-internal-api"] }
